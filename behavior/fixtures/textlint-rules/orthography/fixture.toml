id = "orthography-family"
tool = "textlint"
command = ["textlint", "--rulesdir", "../../../packages/textlint-rules/dist/families/orthography", "family.md"]
family = "orthography"

valid_prerequisites = [
  "textlint_package_built",
  "markdown_fixture_present"
]

intentionally_invalid = [
  "closed_em_dash",
  "title_case_heading",
  "smart_quotes",
  "exclamation_density",
  "fake_timestamp",
  "dramatic_colon"
]
