id = "syntactic-patterns-family"
tool = "textlint"
family = "syntactic-patterns"

valid_prerequisites = [
  "textlint_package_built",
  "markdown_fixture_present"
]

intentionally_invalid = [
  "the goal is not x then the goal is y",
  "you do not need x then you need y",
  "comma not contrast",
  "fragment stack",
  "triple repeat opener",
  "demonstrative emphasis over document threshold",
  "llm opener at section start",
  "generic signposting frame",
  "generalized evaluative lead-in",
  "apostrophe contraction signpost",
  "boilerplate framing preview",
  "lesson framing wrapper",
  "observer guidance bridge",
  "response wrapper",
  "softening language stack",
  "generalized softening stack",
  "universalizing claim",
  "generalized universalizing claim",
  "authority padding",
  "generalized authority padding",
  "contrastive aphorism pair",
  "empty emphasis line",
  "blame reframe",
  "affirmation closer at section end",
  "short formula affirmation anywhere",
  "basic rule simple boilerplate conclusion",
  "generalized formula conclusion",
  "summative closer at section end",
  "boilerplate conclusion",
  "false question at section end"
]

intentionally_valid = [
  "subordinate clause before contracted negated verb",
  "negative second sentence is not a reframe",
  "not too modifier is not a contrast reframe",
  "not all quantifier is not a contrast reframe",
  "concrete opener is not an llm opener",
  "concrete closer is not an affirmation closer",
  "direct question is not a false question",
  "long that's-the sentence is not a formula line"
]
