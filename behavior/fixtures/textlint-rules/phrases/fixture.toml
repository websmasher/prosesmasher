id = "phrases-family"
tool = "textlint"
family = "phrases"

valid_prerequisites = [
  "textlint_package_built",
  "markdown_fixture_present"
]

intentionally_invalid = [
  "as a language model",
  "in today's fast-paced world",
  "let's dive in",
  "in my experience",
  "as someone who has",
  "optimizing for as borrowed persona jargon",
  "debug your as borrowed persona jargon"
]

intentionally_valid = [
  "debug your build script as literal technical prose",
  "optimizing for latency as literal technical prose"
]
