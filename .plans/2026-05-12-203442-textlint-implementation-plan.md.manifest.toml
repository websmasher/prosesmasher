plan = ".plans/2026-05-12-203442-textlint-implementation-plan.md"
manifest_version = 1

[package]
path = "packages/textlint-rules"
name = "@prosesmasher/textlint-rules"
type = "module"
private = true

runtime_dependencies = [
  "@textlint/types",
  "sentence-splitter",
  "textlint",
  "textlint-rule-helper",
  "textlint-util-to-string",
]

dev_dependencies = [
  "@typescript-eslint/eslint-plugin",
  "@typescript-eslint/parser",
  "eslint",
  "typescript",
]

forbidden_dependencies = [
  "escape-string-regexp",
  "natural",
  "nlcst-search",
  "retext-english",
  "retext-equality",
  "retext-readability",
  "retext-simplify",
  "split-string-words",
]

[g3ts]
config_path = "packages/textlint-rules/guardrail3-ts.toml"
required = true
run_on_package = "packages/textlint-rules"

[[tree]]
path = "packages/textlint-rules"

[[tree]]
path = "packages/textlint-rules/src/families/markdown-layout"

[[tree]]
path = "packages/textlint-rules/src/families/orthography"

[[tree]]
path = "packages/textlint-rules/src/families/metrics"

[[tree]]
path = "packages/textlint-rules/src/families/term-policy"

[[tree]]
path = "packages/textlint-rules/src/families/words"

[[tree]]
path = "packages/textlint-rules/src/families/phrases"

[[tree]]
path = "packages/textlint-rules/src/families/syntactic-patterns"

[[tree]]
path = "packages/textlint-rules/src/families/syntactic-patterns/llm-artifacts"

[[tree]]
path = "packages/textlint-rules/src/families/syntactic-patterns/lead-ins"

[[tree]]
path = "packages/textlint-rules/src/families/syntactic-patterns/contrast"

[[tree]]
path = "packages/textlint-rules/src/families/syntactic-patterns/closers"

[[tree]]
path = "packages/textlint-rules/src/families/syntactic-patterns/repetition"

[[tree]]
path = "packages/textlint-rules/src/families/syntactic-patterns/authority"

[[tree]]
path = "packages/textlint-rules/src/families/syntactic-patterns/generalization"

[[tree]]
path = "packages/textlint-rules/src/families/semantic-thinness"

[[tree]]
path = "packages/textlint-rules/src/presets"

[[tree]]
path = "packages/textlint-rules/src/shared/text"

[[tree]]
path = "packages/textlint-rules/src/shared/matchers"

[[tree]]
path = "behavior/fixtures/textlint-rules"

[[tree]]
path = "behavior/baselines/textlint-rules"

[[tree]]
path = "behavior/deltas/textlint-rules"

[[tree]]
path = "behavior/schemas/textlint-rules"

[[shared_file]]
path = "packages/textlint-rules/src/shared/text/normalize.ts"

[[shared_file]]
path = "packages/textlint-rules/src/shared/text/quotes.ts"

[[shared_file]]
path = "packages/textlint-rules/src/shared/text/tokens.ts"

[[shared_file]]
path = "packages/textlint-rules/src/shared/text/sentences.ts"

[[shared_file]]
path = "packages/textlint-rules/src/shared/text/traverse.ts"

[[shared_file]]
path = "packages/textlint-rules/src/shared/text/whitespace.ts"

[[shared_file]]
path = "packages/textlint-rules/src/shared/matchers/phrases.ts"

[[shared_file]]
path = "packages/textlint-rules/src/shared/matchers/syntactic-templates.ts"

[[rule]]
id = "em-dashes"
family = "orthography"
path = "packages/textlint-rules/src/families/orthography/em-dashes.ts"
rust_rule = "em-dashes"

[[rule]]
id = "smart-quotes"
family = "orthography"
path = "packages/textlint-rules/src/families/orthography/smart-quotes.ts"
rust_rule = "smart-quotes"

[[rule]]
id = "sentence-case"
family = "orthography"
path = "packages/textlint-rules/src/families/orthography/sentence-case.ts"
rust_rule = "sentence-case"

[[rule]]
id = "exclamation-density"
family = "orthography"
path = "packages/textlint-rules/src/families/orthography/exclamation-density.ts"
rust_rule = "exclamation-density"

[[rule]]
id = "fake-timestamps"
family = "orthography"
path = "packages/textlint-rules/src/families/orthography/fake-timestamps.ts"
rust_rule = "fake-timestamps"

[[rule]]
id = "colon-dramatic"
family = "orthography"
path = "packages/textlint-rules/src/families/orthography/colon-dramatic.ts"
rust_rule = "colon-dramatic"

[[rule]]
id = "prohibited-words"
family = "words"
path = "packages/textlint-rules/src/families/words/prohibited-words.ts"
rust_rule = "prohibited-terms"
rust_match_subset = "single-token"
data_path = "packages/textlint-rules/src/families/words/data/prohibited-words.json"

[[rule]]
id = "prohibited-phrases"
family = "phrases"
path = "packages/textlint-rules/src/families/phrases/prohibited-phrases.ts"
rust_rule = "prohibited-terms"
rust_match_subset = "multi-token"
data_path = "packages/textlint-rules/src/families/phrases/data/prohibited-phrases.json"

[[rule]]
id = "negation-reframe"
family = "syntactic-patterns/contrast"
path = "packages/textlint-rules/src/families/syntactic-patterns/contrast/negation-reframe.ts"
rust_rule = "negation-reframe"

[[preset]]
id = "everything"
path = "packages/textlint-rules/src/presets/everything.ts"
rules = [
  "colon-dramatic",
  "em-dashes",
  "exclamation-density",
  "fake-timestamps",
  "prohibited-words",
  "prohibited-phrases",
  "negation-reframe",
  "sentence-case",
  "smart-quotes",
]

[[regex_guardrail]]
kind = "syntax"
selector = "Literal[regex]"
scope = "packages/textlint-rules/src/families"

[[regex_guardrail]]
kind = "syntax"
selector = "NewExpression[callee.name='RegExp']"
scope = "packages/textlint-rules/src/families"

[[regex_guardrail]]
kind = "syntax"
selector = "CallExpression[callee.name='RegExp']"
scope = "packages/textlint-rules/src/families"

[[regex_guardrail]]
kind = "import"
package = "escape-string-regexp"
scope = "packages/textlint-rules/src/families"

[[fixture_family]]
id = "markdown-layout"
fixture = "behavior/fixtures/textlint-rules/markdown-layout/family.md"
metadata = "behavior/fixtures/textlint-rules/markdown-layout/fixture.toml"

[[fixture_family]]
id = "orthography"
fixture = "behavior/fixtures/textlint-rules/orthography/family.md"
metadata = "behavior/fixtures/textlint-rules/orthography/fixture.toml"

[[fixture_family]]
id = "metrics"
fixture = "behavior/fixtures/textlint-rules/metrics/family.md"
metadata = "behavior/fixtures/textlint-rules/metrics/fixture.toml"

[[fixture_family]]
id = "term-policy"
fixture = "behavior/fixtures/textlint-rules/term-policy/family.md"
metadata = "behavior/fixtures/textlint-rules/term-policy/fixture.toml"

[[fixture_family]]
id = "words"
fixture = "behavior/fixtures/textlint-rules/words/family.md"
metadata = "behavior/fixtures/textlint-rules/words/fixture.toml"

[[fixture_family]]
id = "phrases"
fixture = "behavior/fixtures/textlint-rules/phrases/family.md"
metadata = "behavior/fixtures/textlint-rules/phrases/fixture.toml"

[[fixture_family]]
id = "syntactic-patterns"
fixture = "behavior/fixtures/textlint-rules/syntactic-patterns/family.md"
metadata = "behavior/fixtures/textlint-rules/syntactic-patterns/fixture.toml"

[[fixture_family]]
id = "semantic-thinness"
fixture = "behavior/fixtures/textlint-rules/semantic-thinness/family.md"
metadata = "behavior/fixtures/textlint-rules/semantic-thinness/fixture.toml"

[[behavior_script]]
id = "baseline"
path = "scripts/behavior-baseline.sh"

[[behavior_script]]
id = "replay"
path = "scripts/behavior-replay.sh"

[[behavior_script]]
id = "diff"
path = "scripts/behavior-diff.sh"

[[behavior_script]]
id = "accept"
path = "scripts/behavior-accept.sh"

[[behavior_script]]
id = "verify"
path = "scripts/behavior-verify.sh"
